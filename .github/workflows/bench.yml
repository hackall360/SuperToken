name: Benchmarks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    outputs:
      benchmark-json: ${{ steps.collect.outputs.json_path }}
      benchmark-table: ${{ steps.collect.outputs.table_path }}
      benchmark-plot: ${{ steps.collect.outputs.plot_path }}
      evaluation-json: ${{ steps.collect.outputs.evaluation_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1+cu118 --index-url https://download.pytorch.org/whl/cu118
          pip install matplotlib pandas

      - name: Run benchmark
        id: bench
        env:
          PYTORCH_JIT: '0'
          ARTIFACT_DIR: artifacts/benchmarks
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          python main.py benchmark \
            --synthetic-docs 4 \
            --synthetic-min-len 8 \
            --synthetic-max-len 16 \
            --synthetic-vocab 128 \
            --bpe-merges 32 \
            --bpe-batch-size 32 \
            --bpe-log-every 0 \
            --unigram-batch-size 32 \
            --unigram-vocab 128 \
            --unigram-epochs 2 \
            --output-dir "$ARTIFACT_DIR" \
            --device cpu | tee "$ARTIFACT_DIR/latest_summary.txt"

      - name: Run evaluation smoke test
        env:
          ARTIFACT_DIR: artifacts/evaluations
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          python main.py evaluate \
            --data tests/data/evaluate_corpus/plain.txt \
            --artifacts tests/data/models/bpe \
            --morphology-lang tr \
            --morphology-case-markers \
            --morphology-affix-tags \
            --deterministic \
            --force-evaluation \
            --output "$ARTIFACT_DIR/ci_evaluation.json"
          python - <<'PY'
import json, pathlib
report_path = pathlib.Path("artifacts/evaluations/ci_evaluation.json")
data = json.loads(report_path.read_text(encoding="utf-8"))
compression = data.get("compression", {})
oov = data.get("oov", {})
print(f"[evaluate][ci] tokens_per_byte={compression.get('tokens_per_byte')} oov_rate={oov.get('rate')}")
PY

      - name: Generate trend report
        run: |
          python benchmarks/trend_report.py \
            --input artifacts/benchmarks \
            --output-dir artifacts/benchmarks/trends \
            --baseline-bpe 1.0 \
            --baseline-unigram 1.0

      - name: Collect outputs
        id: collect
        run: |
          set -euo pipefail
          json_path=$(ls -t artifacts/benchmarks/benchmark_*.json | head -n1)
          if [ -z "$json_path" ]; then
            echo "No benchmark JSON files were produced" >&2
            exit 1
          fi
          table_path=artifacts/benchmarks/trends/trend_table.md
          plot_path=artifacts/benchmarks/trends/trend_plot.png
          summary_path=artifacts/benchmarks/latest_summary.txt
          evaluation_path=artifacts/evaluations/ci_evaluation.json

          echo "json_path=${json_path}" >> "$GITHUB_OUTPUT"
          echo "table_path=${table_path}" >> "$GITHUB_OUTPUT"
          echo "plot_path=${plot_path}" >> "$GITHUB_OUTPUT"
          echo "summary_path=${summary_path}" >> "$GITHUB_OUTPUT"
          if [ -f "$evaluation_path" ]; then
            echo "evaluation_path=${evaluation_path}" >> "$GITHUB_OUTPUT"
          fi

          {
            echo '### Latest benchmark summary'
            cat "$summary_path"
            echo
            echo '### Trend table'
            cat "$table_path"
            if [ -f "$evaluation_path" ]; then
              echo
              echo '### Evaluation snapshot'
              python - "$evaluation_path" <<'PY'
import json, pathlib, sys
path = pathlib.Path(sys.argv[1])
report = json.loads(path.read_text(encoding="utf-8"))
compression = report.get("compression", {})
oov = report.get("oov", {})
print(f"- tokens_per_byte: {compression.get('tokens_per_byte')}")
print(f"- oov_rate: {oov.get('rate')}")
PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            artifacts/benchmarks/benchmark_*.json
            artifacts/benchmarks/latest_summary.txt
            artifacts/benchmarks/trends/trend_table.md
            artifacts/benchmarks/trends/trend_plot.png
            artifacts/benchmarks/trends/trend_manifest.json
            artifacts/evaluations/ci_evaluation.json
